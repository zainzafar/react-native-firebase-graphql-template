name: Android Build

on:
  workflow_dispatch:
    inputs:
      lane:
        description: 'Fastlane lane to run (build = dual-mode, beta = Play internal upload)'
        required: true
        default: 'build'
        type: choice
        options:
          - build
          - beta
      flavor:
        description: 'Android flavor (leave empty to use Fastfile default)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - development
          - staging
          - production
      release_status:
        description: 'Release Status (Internal track must be draft; Play blocks completed on internal)'
        required: false
        type: choice
        options:
          - draft
          - completed
        default: "draft"
      build_number:
        description: 'Override build number (leave empty for auto-increment)'
        required: false
        default: ''
        type: string

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            mobile/package-lock.json
            api/package-lock.json

      - name: Install JS deps
        run: npm ci -legacy-peer-deps

      - name: Install API deps
        working-directory: api
        run: npm ci --no-audit --no-fund

      - name: Generate GraphQL types for mobile
        working-directory: api
        run: |
          if [ -f "codegen.yml" ]; then
            echo "🛠️ Running GraphQL Codegen using local schema from api/src/graphql/types/**/*.graphql"
            npx graphql-codegen --config codegen.yml
          else
            echo "❌ api/codegen.yml not found. Please add codegen config that outputs to ../mobile/src/generated/"
            exit 1
          fi

      - name: Set up Ruby (for fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: mobile

      - name: Set up JDK 17 (Android Gradle Plugin 8+)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Write .env
        run: |
          cat > .env <<'EOF'
          # Android-specific .env
          APP_NAME=${{ secrets.APP_NAME }}
          APP_DISPLAY_NAME=${{ secrets.APP_DISPLAY_NAME }}
          ANDROID_APPLICATION_ID=${{ secrets.ANDROID_APPLICATION_ID }}
          GRAPHQL_API_URL=${{ secrets.GRAPHQL_API_URL }}
          EOF

      - name: Decode keystore to temp path (if provided)
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            mkdir -p /tmp/keystore
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > /tmp/keystore/upload.jks
            echo "ANDROID_KEYSTORE_PATH=/tmp/keystore/upload.jks" >> $GITHUB_ENV
          fi

      - name: Decode Google Play service account key (if provided)
        run: |
          if [ -n "${{ secrets.GOOGLE_PLAY_SERVICE_KEY_B64 }}" ]; then
            mkdir -p android/fastlane
            echo "${{ secrets.GOOGLE_PLAY_SERVICE_KEY_B64 }}" | base64 --decode > android/fastlane/play-store-service-key.json
            echo "GOOGLE_PLAY_JSON_PATH=android/fastlane/play-store-service-key.json" >> $GITHUB_ENV
          fi

      - name: Set Google Play JSON data (if provided as inline JSON)
        run: |
          if [ -n "${{ secrets.GOOGLE_PLAY_JSON_DATA }}" ]; then
            echo "GOOGLE_PLAY_JSON_DATA=${{ secrets.GOOGLE_PLAY_JSON_DATA }}" >> $GITHUB_ENV
          fi

      - name: Ensure google-services.json for Debug
        if: ${{ github.event.inputs.lane == 'build' }}   # only for build lane; beta should use real file
        run: |
          set -e
          FLAVOR="${{ github.event.inputs.flavor || 'development' }}"
          APP_ID="${{ secrets.ANDROID_APPLICATION_ID }}"
          BASE="android/app"

          # If a real file is already present (root or flavor), do nothing
          if [ -f "$BASE/google-services.json" ] || [ -f "$BASE/src/$FLAVOR/google-services.json" ]; then
            echo "google-services.json already present"
            exit 0
          fi

          mkdir -p "$BASE/src/$FLAVOR"
          cat > "$BASE/src/$FLAVOR/google-services.json" <<EOF
          {
            "project_info": { "project_number": "0", "project_id": "placeholder" },
            "client": [{
              "client_info": { "mobilesdk_app_id": "1:0:android:debug", "android_client_info": { "package_name": "$APP_ID" } },
              "api_key": [{ "current_key": "debug-placeholder" }]
            }],
            "configuration_version": "1"
          }
          EOF

          echo "Wrote placeholder google-services.json for flavor: $FLAVOR"

      - name: Fastlane Android build (dual-mode)
        env:
          ANDROID_FLAVOR: ${{ github.event.inputs.flavor }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_STATUS: ${{ github.event.inputs.release_status || 'draft' }}
          BUILD_NUMBER: ${{ github.event.inputs.build_number || '' }}
        run: |
          bundle exec fastlane android ${{ github.event.inputs.lane || 'build' }}

      # - name: Cleanup temp keystore
      #   if: always()
      #   run: rm -rf /tmp/keystore