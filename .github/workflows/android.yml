name: Android Build

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        default: staging
        options: [staging, production]
      lane:
        description: 'Fastlane lane to run (build = dual-mode, beta = Play internal upload)'
        required: true
        default: 'build'
        type: choice
        options:
          - build
          - beta
      track:
        description: 'Google Play track for beta lane'
        required: false
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      release_status:
        description: 'Release Status (Internal track must be draft; Play blocks completed on internal)'
        required: false
        type: choice
        options:
          - draft
          - completed
        default: "draft"
      build_type:
        description: 'Android build type (Auto = Release if keystore present, otherwise Debug)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - Release
          - Debug
      packaging:
        description: "Packaging format (AAB for Play, APK for testing)"
        required: false
        default: "auto"
        type: choice
        options:
          - aab
          - apk
          - auto
      build_number:
        description: 'Override build number (leave empty for auto-increment)'
        required: false
        default: ''
        type: string

jobs:
  android:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            mobile/package-lock.json
            api/package-lock.json

      - name: Install JS deps
        run: npm ci -legacy-peer-deps

      - name: Install API deps
        working-directory: api
        run: npm ci --no-audit --no-fund

      - name: Generate GraphQL types for mobile
        working-directory: api
        run: |
          if [ -f "codegen.yml" ]; then
            echo "🛠️ Running GraphQL Codegen using local schema from api/src/graphql/types/**/*.graphql"
            npx graphql-codegen --config codegen.yml
          else
            echo "❌ api/codegen.yml not found. Please add codegen config that outputs to ../mobile/src/generated/"
            exit 1
          fi

      - name: Set up Ruby (for fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: mobile

      - name: Set up JDK 17 (Android Gradle Plugin 8+)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Write .env
        run: |
          cat > .env <<'EOF'
          # Android-specific .env
          APP_NAME=${{ vars.APP_NAME || 'App' }}
          APP_DISPLAY_NAME=${{ vars.APP_DISPLAY_NAME || 'App' }}
          ANDROID_APPLICATION_ID=${{ vars.ANDROID_APPLICATION_ID || 'com.example.app' }}
          GRAPHQL_API_URL=${{ vars.GRAPHQL_API_URL }}
          GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          EOF

      - name: Decode keystore to temp path (if provided)
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            mkdir -p /tmp/keystore
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > /tmp/keystore/upload.jks
            echo "ANDROID_KEYSTORE_PATH=/tmp/keystore/upload.jks" >> $GITHUB_ENV
          fi

      # One of the following Google Play authentication methods is required:
      # - GOOGLE_PLAY_SERVICE_KEY_B64: Base64-encoded service account key file
      # - GOOGLE_PLAY_JSON_DATA: Inline JSON service account data
      - name: Decode Google Play service account key (if provided)
        run: |
          if [ -n "${{ secrets.GOOGLE_PLAY_SERVICE_KEY_B64 }}" ]; then
            mkdir -p android/fastlane
            echo "${{ secrets.GOOGLE_PLAY_SERVICE_KEY_B64 }}" | base64 --decode > android/fastlane/play-store-service-key.json
            echo "GOOGLE_PLAY_JSON_PATH=android/fastlane/play-store-service-key.json" >> $GITHUB_ENV
          fi

      - name: Set Google Play JSON data (if provided as inline JSON)
        run: |
          if [ -n "${{ secrets.GOOGLE_PLAY_JSON_DATA }}" ]; then
            echo "GOOGLE_PLAY_JSON_DATA=${{ secrets.GOOGLE_PLAY_JSON_DATA }}" >> $GITHUB_ENV
          fi

      - name: Decode google-services.json (if provided)
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | base64 --decode > android/app/google-services.json
            echo "✅ Created google-services.json from secret"
          else
            echo "ℹ️ No google-services.json provided; build.gradle will conditionally skip Google Services plugin"
          fi

      - name: Fastlane Android build (dual-mode)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_TRACK: ${{ github.event.inputs.track || 'internal' }}
          RELEASE_STATUS: ${{ github.event.inputs.release_status || 'draft' }}
          BUILD_NUMBER: ${{ github.event.inputs.build_number || '' }}
          ANDROID_BUILD_TYPE: ${{ github.event.inputs.build_type || 'auto' }}
          ANDROID_PACKAGING: ${{ github.event.inputs.packaging || 'aab' }}
        run: |
          bundle exec fastlane android ${{ github.event.inputs.lane || 'build' }}


      - name: Cleanup temp keystore
        if: always()
        run: rm -rf /tmp/keystore

      - name: Upload Android artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: mobile/artifacts/android
          if-no-files-found: ignore