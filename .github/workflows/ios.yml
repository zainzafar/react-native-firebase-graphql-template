name: iOS Build

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        default: staging
        options: [staging, production]
      lane:
        description: 'Fastlane lane to run (build = dual-mode, beta = TestFlight upload)'
        required: true
        default: 'build'
        type: choice
        options:
          - build
          - beta
      ios_build_mode:
        description: 'Force IOS_BUILD_MODE (auto uses Fastfile logic)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - simulator
          - release
      build_number:
        description: 'Override build number (leave empty for auto-increment)'
        required: false
        default: ''
        type: string
      ios_signing_mode:
        description: 'iOS signing mode (only applies when build mode is release)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - match
          - automatic

jobs:
  ios:
    environment: ${{ inputs.environment }}
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      # Node is needed because Xcode build runs the RN bundle step
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            mobile/package-lock.json
            api/package-lock.json

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Install JS deps
        run: npm ci -legacy-peer-deps

      - name: Install API deps
        working-directory: api
        run: npm ci --no-audit --no-fund

      - name: Generate GraphQL types for mobile
        working-directory: api
        run: |
          if [ -f "codegen.yml" ]; then
            echo "🛠️ Running GraphQL Codegen using local schema from api/src/graphql/types/**/*.graphql"
            npx graphql-codegen --config codegen.yml
          else
            echo "❌ api/codegen.yml not found. Please add codegen config that outputs to ../mobile/src/generated/"
            exit 1
          fi

      - name: Set up Ruby (for fastlane/cocoapods)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: mobile

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: mobile/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('mobile/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: Write .env (for react-native-config)
        run: |
          cat > .env <<'EOF'
          # iOS-specific .env
          APP_NAME=${{ vars.APP_NAME || 'App' }}
          APP_DISPLAY_NAME=${{ vars.APP_DISPLAY_NAME || 'App' }}
          IOS_BUNDLE_ID=${{ vars.IOS_BUNDLE_ID || 'com.example.app' }}
          GRAPHQL_API_URL=${{ vars.GRAPHQL_API_URL }}
          GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_REVERSED_CLIENT_ID=${{ secrets.GOOGLE_REVERSED_CLIENT_ID }}
          EOF

      - name: Decode GoogleService-Info.plist (if provided)
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}" | base64 --decode > ios/GoogleService-Info.plist
            echo "✅ Created GoogleService-Info.plist from secret"
          else
            # Create a minimal placeholder to avoid build errors
            cat > ios/GoogleService-Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>PROJECT_ID</key>
            <string>placeholder</string>
            <key>BUNDLE_ID</key>
            <string>${{ vars.IOS_BUNDLE_ID || 'com.example.app' }}</string>
            <key>IS_ADS_ENABLED</key>
            <false/>
            <key>IS_ANALYTICS_ENABLED</key>
            <false/>
            <key>IS_APPINVITE_ENABLED</key>
            <true/>
            <key>IS_GCM_ENABLED</key>
            <true/>
            <key>IS_SIGNIN_ENABLED</key>
            <true/>
            <key>GOOGLE_APP_ID</key>
            <string>1:0:ios:placeholder</string>
          </dict>
          </plist>
          EOF
            echo "⚠️ Created placeholder GoogleService-Info.plist (no Firebase config provided)"
          fi

      # ── Enable signing methods in the "Fastlane iOS build" step below ─────────────
      # For TestFlight upload, you need BOTH:
      # 1) App Store Connect API Key (for upload)
      # 2) Code signing (choose ONE method):
      #    - Match signing (recommended for CI)
      #    - Xcode automatic/managed signing
      #
      # App Store Connect API Key (required for TestFlight upload)
      # env:
      #   APP_STORE_CONNECT_API_KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
      #   APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
      #   APP_STORE_CONNECT_API_KEY_CONTENT_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT_B64 }}
      #
      # Code signing method 1: Fastlane Match (recommended)
      # env:
      #   MATCH_GIT_URL: ${{ vars.MATCH_GIT_URL }}
      #   MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      #   MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION || '' }}
      #
      # Code signing method 2: Xcode automatic/managed signing
      # env:
      #   APPLE_DEVELOPER_TEAM_ID: ${{ vars.APPLE_DEVELOPER_TEAM_ID }}
      #   IOS_SIGNING_MODE: automatic
      # ───────────────────────────────────────────────────────────

      - name: Fastlane iOS build (dual-mode)
        env:
          # Note: beta lane always archives Release and uploads to TestFlight; IOS_BUILD_MODE is ignored for beta.
          IOS_BUILD_MODE: ${{ github.event.inputs.lane == 'build' && github.event.inputs.ios_build_mode != 'auto' && github.event.inputs.ios_build_mode || '' }}
          IOS_SIGNING_MODE: ${{ github.event.inputs.ios_signing_mode || '' }}
          BUILD_NUMBER: ${{ github.event.inputs.build_number || '' }}
          # App Store Connect API Key (preferred for CI) - uncomment when ready
          APPLE_DEVELOPER_TEAM_ID: ${{ vars.APPLE_DEVELOPER_TEAM_ID || '' }}
          APP_STORE_CONNECT_TEAM_ID: ${{ vars.APP_STORE_CONNECT_TEAM_ID || '' }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ID || '' }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID || '' }}
          APP_STORE_CONNECT_API_KEY_CONTENT_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT_B64 || '' }}
          MATCH_GIT_URL: ${{ vars.MATCH_GIT_URL || '' }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD || '' }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION || '' }}
        run: bundle exec fastlane ios ${{ github.event.inputs.lane || 'build' }}

      - name: Upload iOS artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-artifacts
          path: mobile/artifacts/ios
          if-no-files-found: ignore
