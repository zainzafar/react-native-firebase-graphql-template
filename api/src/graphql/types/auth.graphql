extend type Query {
  me: User
}

extend type Mutation {
  loginWithIdToken(idToken: String!): AuthPayload!
}

type User {
  uid: ID!
  email: String
  emailVerified: Boolean!
  displayName: String
  photoURL: String
  phoneNumber: String
  providerId: String
}

type AuthPayload {
  user: User!
  accessToken: String
}


