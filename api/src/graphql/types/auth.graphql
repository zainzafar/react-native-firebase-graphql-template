extend type Query {
  me: User
}

extend type Mutation {
  loginWithIdToken(idToken: String!): AuthPayload!
  updateProfile(displayName: String, photoURL: String): User!
}

enum RoleGrantScope {
  ROLE
  ALL
}

enum PermissionGrantScope {
  PERMISSION
  ALL
}

type Permission {
  id: ID!
  name: String!
  description: String
  createdAt: Timestamp!
  updatedAt: Timestamp!
}

type Role {
  id: ID!
  name: String!
  description: String
  permissions: [Permission!]!
  users: [User!]!
  createdAt: Timestamp!
  updatedAt: Timestamp!
  
  # Role ownership
  createdByUser: User
  
  # Delegation matrix relations
  canGrantRolesRules: [RoleGrantRule!]!
  canBeGrantedByRolesRules: [RoleGrantRule!]!
  canGrantPermissionsRules: [PermissionGrantRule!]!
}

type RoleGrantRule {
  id: ID!
  granterRole: Role!
  granteeRole: Role
  scope: RoleGrantScope!
  canAssign: Boolean!
  canRevoke: Boolean!
  createdAt: Timestamp!
  updatedAt: Timestamp!
}

type PermissionGrantRule {
  id: ID!
  granterRole: Role!
  permission: Permission
  scope: PermissionGrantScope!
  canAssign: Boolean!
  canRevoke: Boolean!
  createdAt: Timestamp!
  updatedAt: Timestamp!
}

type User {
  id: ID!
  uid: ID!
  email: String
  emailVerified: Boolean!
  displayName: String
  photoURL: String
  phoneNumber: String
  lastLoginProvider: String
  identities: [UserIdentity!]!
  createdAt: Timestamp!
  role: Role
  permissions: [String!]!
  ownedRoles: [Role!]!
}

type AuthPayload {
  user: User!
  accessToken: String
}

type UserIdentity {
  providerId: String!
  providerUid: String!
  lastUsedAt: Timestamp
}


