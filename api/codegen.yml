schema: "src/graphql/types/**/*.graphql"
ignoreNoDocuments: true
allowPartialOutputs: true

generates:
  src/generated/resolvers-types.ts:
    plugins:
      - "@graphql-codegen/typescript"
      - "@graphql-codegen/typescript-resolvers"
    config:
      useIndexSignature: true
      contextType: "../server/apollo#GraphQLContext"
      avoidOptionals: true
      enumsAsTypes: true

  ../mobile/src/generated/:
    preset: "@graphql-codegen/client-preset"
    documents:
      - "../mobile/src/**/*.graphql"
      - "../mobile/src/**/*.gql"
      - "../mobile/src/graphql/**/*.ts"
      - "../mobile/src/graphql/**/*.tsx"
      - "../mobile/src/graphql/operations.ts"
    config:
      useTypeImports: true
      skipTypename: false

  src/generated/schema.json:
    plugins:
      - "@graphql-codegen/introspection"
